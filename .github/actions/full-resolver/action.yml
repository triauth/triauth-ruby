# The live zone tests ask the system resolver, through the port's SystemDns over Resolv::DNS, for a
# 40-record TXT RRset (~4.7 KB) and expect it in full. The Azure-provided resolver (168.63.129.16)
# behind the hosted runners caps such an answer at about 1.1 KB and now and then omits the
# truncation flag, so SystemDns accepts 8 of the 40 records as a complete answer. Both servers
# below answer an oversized query with the truncation flag and deliver the full set over TCP.
# SystemDns reads /etc/resolv.conf through Resolv::DNS::Config on every query and sends its own
# packets, so a change made here is in effect for every later step. The port's CI runs on ubuntu
# only, so the Windows step of the triauth-js action is not carried.
name: Full recursive resolver
description: Points the system resolver at 9.9.9.9 and 1.1.1.1, then shows the path SystemDns uses.

runs:
  using: composite
  steps:
    - name: Point the system resolver at 9.9.9.9 and 1.1.1.1 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        link="$(ip -o route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "dev") print $(i + 1) }')"
        sudo resolvectl dns "$link" 9.9.9.9 1.1.1.1
        sudo resolvectl flush-caches
        resolvectl dns "$link"

    - name: Show the resolver path SystemDns uses
      shell: bash
      run: |
        ruby -Ilib -e 'require "triauth"; r = Triauth::Resolvers::SystemDns.new({ timeout: 4000, tries: 2 }).resolve("big.dns-test.triauthdemo.org", "TXT"); puts "big.dns-test.triauthdemo.org: #{r.length} of 40"'
